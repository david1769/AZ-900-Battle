<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0716;color:#fff;font-family:ui-monospace,"Courier New",monospace;display:flex;justify-content:center}
#wrap{width:100%;max-width:1200px;padding:8px}
.stage{position:relative;border:4px solid #2a1a52;border-radius:6px;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#panel{margin-top:8px;border:4px solid #6ee7d1;background:rgba(15,10,35,.96);padding:12px 16px;border-radius:6px;min-height:190px}
#meta{display:flex;justify-content:space-between;font-size:13px;color:#9be7ff;margin-bottom:6px;gap:8px;flex-wrap:wrap}
#q{font-size:clamp(15px,2.1vw,20px);font-weight:700;line-height:1.35;margin:4px 0 10px;text-shadow:2px 2px #000}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){#opts{grid-template-columns:1fr}}
.opt{font:inherit;font-size:clamp(13px,1.6vw,16px);text-align:left;color:#fff;background:#241545;border:3px solid #6b4fb3;border-radius:4px;padding:10px 12px;cursor:pointer;transition:transform .08s,background .15s}
.opt:hover:not(:disabled){background:#35206a;transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.ok{background:#0e5b3a;border-color:#4ade80}
.opt.bad{background:#6b1420;border-color:#f87171}
.opt.dim{opacity:.55}
#exp{margin-top:10px;font-size:14px;line-height:1.45;color:#e6f7ff;background:#102a3a;border-left:5px solid #6ee7d1;padding:8px 12px;display:none}
#exp small{display:block;margin-top:6px;color:#8fb3c7}
#exp a{color:#7dd3fc}
button.big{font:inherit;font-weight:700;font-size:16px;color:#0b0716;background:#6ee7d1;border:0;border-bottom:5px solid #2aa08a;border-radius:4px;padding:10px 22px;cursor:pointer;margin-top:10px}
button.big:hover{background:#9af5e2}
#overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(8,4,20,.72);padding:16px}
#overlay h1{font-size:clamp(34px,7vw,76px);margin:0 0 8px;letter-spacing:4px;text-shadow:4px 4px #000}
#overlay p{font-size:clamp(13px,1.8vw,19px);max-width:760px;line-height:1.5;margin:4px 0}
.win h1{color:#fde047}.lose h1{color:#f87171}
</style>
</head>

/* ===================== GAME CONFIG ===================== */
const W=1200,H=646,GROUND=590,SCALE=1.15;
const QUESTIONS_PER_RUN=30;
// Enemy HP = 800. 34 dmg per correct answer => 24 correct (80% of 30) wins.
// Hero HP = 700. 70 dmg per wrong answer => the 10th miss (more than 30% wrong) loses.
const ENEMY_MAX=800,HERO_MAX=700,DMG_ENEMY=34,DMG_HERO=70;
const HERO_HOME=290,ENEMY_HOME=905;
// Horizontal feet anchor (fraction of sprite width) so state swaps don't make characters jump.
const AX={hero_idle:.48,hero_attack:.69,hero_defeat:.5,enemy_idle:.5,enemy_attack:.5,enemy_defeat:.5};

/* ===================== SETUP ===================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const fx=document.createElement('canvas');fx.width=420;fx.height=420;const fxc=fx.getContext('2d');
const $=id=>document.getElementById(id);
const IMG={};let bgImg;
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});}
const lerp=(a,b,t)=>a+(b-a)*t,eo=t=>1-Math.pow(1-t,3),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tween(ms,fn,ease=t=>t){return new Promise(res=>{const t0=performance.now();(function f(n){const t=Math.min(1,(n-t0)/ms);fn(ease(t));t<1?requestAnimationFrame(f):res();})(t0);});}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ===================== AUDIO: SFX + 16-BIT MUSIC (all synthesized, no files) ===================== */
let AC,master,musicGain,noiseBuf,musicOn=true,musicTimer=null,mStep=0,mNext=0,P25,P50;
function ac(){
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=1;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=musicOn?.55:0;musicGain.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const pw=duty=>{const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let n=1;n<N;n++)re[n]=2/(n*Math.PI)*Math.sin(n*Math.PI*duty);return AC.createPeriodicWave(re,im);};
    P25=pw(.25);P50=pw(.5);}
  if(AC.state==='suspended')AC.resume();return AC;
}
function beep(f,d=.1,type='square',v=.05,slide=0){try{ac();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.linearRampToValueAtTime(f+slide,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(master);o.start();o.stop(AC.currentTime+d);}catch(e){}}

// Song: A natural minor, 132 BPM, 8 bars (Am F C G | Am F G E), 16 steps per bar. Chiptune voices: pulse lead, pulse arpeggio, triangle bass, noise drums.
const BPM=132,STEP=60/BPM/4,mtof=n=>440*Math.pow(2,(n-69)/12);
const ROOT=[45,41,48,43,45,41,43,40],MIN=[1,0,0,0,1,0,0,0];
const LEAD=[
 [76,0,0,74,72,0,69,0,72,0,74,0,76,0,0,0],[77,0,0,76,74,0,72,0,74,0,76,0,77,0,0,0],
 [79,0,0,76,72,0,76,0,79,0,0,0,76,74,72,0],[74,0,71,0,74,0,79,0,76,0,74,0,71,0,0,0],
 [81,0,0,79,76,0,72,0,76,0,79,0,81,0,0,0],[81,0,0,77,74,0,77,0,81,0,0,0,77,76,74,0],
 [79,0,0,76,74,0,71,0,74,0,76,0,79,0,0,0],[76,0,80,0,83,0,80,0,76,0,0,0,0,0,0,0]];
function tone(t,f,dur,wave,vol){const o=AC.createOscillator(),g=AC.createGain();
  if(wave==='tri')o.type='triangle';else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(musicGain);o.start(t);o.stop(t+dur+.02);}
function drum(t,kind){
  if(kind==='k'){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(musicGain);o.start(t);o.stop(t+.18);return;}
  const n=AC.createBufferSource(),g=AC.createGain(),hp=AC.createBiquadFilter();n.buffer=noiseBuf;hp.type='highpass';hp.frequency.value=kind==='s'?1200:6500;
  g.gain.setValueAtTime(kind==='s'?.22:.07,t);g.gain.exponentialRampToValueAtTime(.001,t+(kind==='s'?.13:.04));n.connect(hp).connect(g).connect(musicGain);n.start(t);n.stop(t+.15);}
function playStep(t,s){
  const bar=(s>>4)%8,i=s&15,r=ROOT[bar],third=MIN[bar]?3:4;
  const arp=[0,third,7,12][i&3];tone(t,mtof(r+24+arp),STEP*1.6,P25,.05);                    // fast arpeggio
  if([0,3,6,8,11,14].includes(i))tone(t,mtof(r+(i===6||i===14?12:0)),STEP*2.2,'tri',.3);   // syncopated bass
  const m=LEAD[bar][i];if(m)tone(t,mtof(m),STEP*(LEAD[bar][i+2]===undefined||LEAD[bar][i+1]?1.6:2.6),P50,.07);  // lead
  if(i===0||i===8||(i===10&&bar%2))drum(t,'k');if(i===4||i===12)drum(t,'s');if(i%2===0)drum(t,'h');
}
function startMusic(){ac();if(musicTimer)return;mNext=AC.currentTime+.08;
  musicTimer=setInterval(()=>{while(mNext<AC.currentTime+.2){playStep(mNext,mStep++);mNext+=STEP;}},30);}
function setMusic(on){musicOn=on;if(AC)musicGain.gain.setTargetAtTime(on?.55:0,AC.currentTime,.05);const b=document.getElementById('mus');if(b)b.textContent=on?'♪ Music: ON':'♪ Music: OFF';}

/* ===================== ACTORS & EFFECTS ===================== */
function mkActor(name,prefix,x,max){return{name,prefix,x,home:x,max,hp:max,shown:max,trail:max,state:'idle',ox:0,oy:0,alpha:1,flash:0,flashCol:'#fff'};}
let hero,enemy,particles=[],floaters=[],rings=[],arc=null,shake=0,screenFlash={a:0,c:'#fff'},vignette=0,perf=0;

function drawActor(a){
  const key=a.prefix+'_'+a.state,s=IMG[key],w=s.w*SCALE,h=s.h*SCALE;
  const bob=a.state==='idle'?Math.sin(perf/260+a.home)*3:0;
  const flip=a.prefix==='enemy',ax=flip?1-AX[key]:AX[key];   // enemy art is mirrored to face the hero
  const dx=a.x+a.ox-w*ax,dy=GROUND+a.oy-h+bob+(a.state==='defeat'?8:0);
  // ground shadow
  ctx.save();ctx.globalAlpha=.35*a.alpha;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(a.x+a.ox,GROUND+4,w*.3,9,0,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.globalAlpha=a.alpha;
  if(flip){ctx.translate(dx+w,0);ctx.scale(-1,1);ctx.drawImage(s.img,0,dy,w,h);}else ctx.drawImage(s.img,dx,dy,w,h);
  if(a.flash>0){ // colour flash limited to the sprite's own pixels
    fxc.clearRect(0,0,420,420);fxc.globalCompositeOperation='source-over';fxc.drawImage(s.img,0,0,w,h);
    fxc.globalCompositeOperation='source-atop';fxc.fillStyle=a.flashCol;fxc.fillRect(0,0,420,420);
    ctx.globalAlpha=a.flash*a.alpha;ctx.drawImage(fx,0,0,w,h,flip?0:dx,dy,w,h);
  }
  ctx.restore();
}
function drawBar(a,x,y,wid,label,col){
  const h=26;ctx.save();
  ctx.fillStyle='#000';ctx.fillRect(x-4,y-4,wid+8,h+8);
  ctx.fillStyle='#2b1f4a';ctx.fillRect(x,y,wid,h);
  ctx.fillStyle='#f5f5f5';ctx.fillRect(x,y,wid*Math.max(0,a.trail/a.max),h);          // damage trail
  const p=Math.max(0,a.shown/a.max);
  ctx.fillStyle=p>.5?col:p>.25?'#fbbf24':'#ef4444';ctx.fillRect(x,y,wid*p,h);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x,y,wid*p,6);
  ctx.strokeStyle='#e9d5ff';ctx.lineWidth=3;ctx.strokeRect(x-1.5,y-1.5,wid+3,h+3);
  ctx.font='bold 16px ui-monospace,monospace';ctx.textBaseline='bottom';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=0;
  ctx.shadowOffsetX=2;ctx.shadowOffsetY=2;ctx.fillText(label,x,y-8);
  ctx.textAlign='right';ctx.fillText(Math.max(0,Math.round(a.shown))+' / '+a.max+' HP',x+wid,y-8);
  ctx.restore();
}
function drawArc(){ // bright blue crescent slash in front of the hero
  if(!arc)return;const t=arc.t,R=150,cx=arc.x,cy=arc.y;
  ctx.save();ctx.globalAlpha=Math.sin(Math.min(1,t)*Math.PI)*1.0;
  ctx.shadowColor='#38bdf8';ctx.shadowBlur=28;
  const g=ctx.createLinearGradient(cx-40,cy-R,cx+90,cy+R);g.addColorStop(0,'#1d4ed8');g.addColorStop(.5,'#e0f7ff');g.addColorStop(1,'#2563eb');
  ctx.fillStyle=g;ctx.beginPath();
  const a0=-1.15+t*.35,a1=1.15-t*.1;
  ctx.arc(cx,cy,R,a0,a1,false);ctx.arc(cx-48-t*10,cy,R+4,a1,a0,true);ctx.closePath();ctx.fill();
  ctx.restore();
}
function addBurst(x,y,n,cols,spd,grav,size=[4,9],life=[40,80]){
  for(let i=0;i<n;i++){const an=Math.random()*6.283,sp=spd*(.3+Math.random());
    particles.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-spd*.3,g:grav,c:cols[Math.random()*cols.length|0],s:size[0]+Math.random()*(size[1]-size[0]),l:life[0]+Math.random()*(life[1]-life[0]),m:0});}
}
function floater(text,x,y,col){floaters.push({text,x,y,col,t:0});}

function frame(now){
  perf=now;ctx.save();
  if(shake>0.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9;}
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(bgImg,0,0,W,H);
  // ease bar values toward targets
  for(const a of[hero,enemy]){a.shown+=(a.hp-a.shown)*.12;if(Math.abs(a.hp-a.shown)<.3)a.shown=a.hp;a.trail+=(a.hp-a.trail)*.03;if(a.flash>0)a.flash=Math.max(0,a.flash-.05);}
  // whoever is mid-attack is drawn last (on top)
  const order=(hero.state==='attack'?[enemy,hero]:enemy.state==='attack'?[hero,enemy]:[hero,enemy]);
  order.forEach(drawActor);
  drawArc();
  rings=rings.filter(r=>(r.t+=.035)<1);rings.forEach(r=>{ctx.save();ctx.globalAlpha=1-r.t;ctx.strokeStyle=r.c;ctx.lineWidth=14*(1-r.t)+2;ctx.beginPath();ctx.arc(r.x,r.y,r.t*r.R,0,7);ctx.stroke();ctx.restore();});
  particles=particles.filter(p=>(p.m++)<p.l);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;ctx.globalAlpha=Math.min(1,(p.l-p.m)/20);ctx.fillStyle=p.c;ctx.fillRect(p.x|0,p.y|0,p.s|0,p.s|0);});ctx.globalAlpha=1;
  floaters=floaters.filter(f=>(f.t+=1)<60);floaters.forEach(f=>{ctx.save();ctx.globalAlpha=1-f.t/60;ctx.font='bold 40px ui-monospace,monospace';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(f.text,f.x+3,f.y-f.t*1.1+3);ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,f.y-f.t*1.1);ctx.restore();});
  drawBar(hero,140,250,320,'AZURE KNIGHT','#38bdf8');
  drawBar(enemy,820,250,320,'CLOUD BEAST','#f87171');
  if(vignette>0){const g=ctx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.9);g.addColorStop(0,'rgba(120,0,0,0)');g.addColorStop(1,`rgba(160,0,0,${vignette})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(screenFlash.a>0.01){ctx.fillStyle=screenFlash.c;ctx.globalAlpha=screenFlash.a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;screenFlash.a*=.88;}
  ctx.restore();requestAnimationFrame(frame);
}

/* ===================== COMBAT SEQUENCES ===================== */
async function heroStrike(){
  const tx=enemy.home-255;
  await tween(380,t=>hero.x=lerp(hero.home,tx,t),eo);
  hero.state='attack';beep(300,.18,'sawtooth',.05,500);
  arc={x:hero.x+95,y:GROUND-125,t:0};
  await tween(260,t=>{hero.ox=t*45;arc.t=t;});
  enemy.hp=Math.max(0,enemy.hp-DMG_ENEMY);enemy.flash=1;enemy.flashCol='#fff';shake=14;
  floater('-'+DMG_ENEMY,enemy.x,GROUND-250,'#fde047');beep(140,.15,'square',.07,-80);
  addBurst(enemy.x-30,GROUND-120,26,['#fff','#7dd3fc','#2563eb'],7,.25);
  if(enemy.hp<=0){arc=null;return;}                       // death handled by caller
  enemy.state='defeat';                                    // damage feedback: stagger in the DEFEAT pose
  await tween(300,t=>enemy.ox=t*30,eo);await sleep(280);arc=null;
  enemy.state='idle';await tween(200,t=>enemy.ox=lerp(30,0,t));
  hero.state='idle';await tween(380,t=>{hero.x=lerp(tx,hero.home,t);hero.ox=lerp(45,0,t);},eo);hero.ox=0;
}
async function enemyStrike(){
  const tx=hero.home+265;
  await tween(380,t=>enemy.x=lerp(enemy.home,tx,t),eo);
  enemy.state='attack';beep(120,.25,'sawtooth',.06,-60);
  await tween(240,t=>enemy.ox=-t*55);
  hero.hp=Math.max(0,hero.hp-DMG_HERO);hero.flash=1;hero.flashCol='#ff2a2a';shake=18;vignette=.55;
  floater('-'+DMG_HERO,hero.x,GROUND-260,'#f87171');beep(90,.2,'square',.08,-40);
  addBurst(hero.x+40,GROUND-110,22,['#fff','#f87171','#7f1d1d'],6,.3);
  if(hero.hp<=0){return;}
  await tween(260,t=>hero.ox=-t*35,eo);await sleep(240);vignette=0;
  await tween(200,t=>hero.ox=lerp(-35,0,t));
  enemy.state='idle';await tween(380,t=>{enemy.x=lerp(tx,enemy.home,t);enemy.ox=lerp(-55,0,t);},eo);enemy.ox=0;
}
async function enemyExplodes(){
  screenFlash={a:.9,c:'#fff'};shake=34;beep(70,.6,'sawtooth',.12,-50);
  const cx=enemy.x+enemy.ox,cy=GROUND-110;
  rings.push({x:cx,y:cy,R:260,t:0,c:'#fde047'},{x:cx,y:cy,R:170,t:0,c:'#fb923c'});
  addBurst(cx,cy,140,['#fff','#fde047','#fb923c','#ef4444','#7c2d12'],13,.28,[5,14],[50,100]);
  enemy.alpha=0;await sleep(350);                         // the blast hides the monster…
  enemy.state='defeat';enemy.alpha=1;enemy.flash=0;       // …then it reappears buried in rubble
  addBurst(cx,GROUND-10,40,['#78716c','#a8a29e','#57534e'],5,.25,[4,9],[40,70]);
  await sleep(900);
}
async function heroFalls(){
  vignette=.8;screenFlash={a:.6,c:'#7f0000'};shake=26;beep(200,.9,'sawtooth',.1,-170);
  hero.state='defeat';
  addBurst(hero.x,GROUND-100,60,['#1e1b4b','#7f1d1d','#9ca3af','#fff'],8,.2,[4,10],[60,110]);
  await sleep(1300);
}

/* ===================== QUIZ FLOW ===================== */
let deck=[],qi=0,correct=0,locked=true,current=null,ended=false;
function startRun(){
  startMusic();
  hero=mkActor('hero','hero',HERO_HOME,HERO_MAX);enemy=mkActor('enemy','enemy',ENEMY_HOME,ENEMY_MAX);
  particles=[];floaters=[];rings=[];arc=null;vignette=0;shake=0;screenFlash.a=0;
  deck=shuffle(BANK.slice()).slice(0,QUESTIONS_PER_RUN);qi=0;correct=0;ended=false;
  $('overlay').style.display='none';showQuestion();
}
function showQuestion(){
  if(qi>=deck.length)deck.push(...shuffle(BANK.slice()));   // safety net; normally the fight ends first
  const q=deck[qi];
  const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0})));
  current={q,opts};locked=false;
  $('dom').textContent='Domain '+q.d+' · '+DOMAINS[q.d];
  $('prog').textContent='Question '+(qi+1)+' / '+QUESTIONS_PER_RUN+'  ·  Correct: '+correct;
  $('q').textContent=q.q;
  $('exp').style.display='none';$('next').style.display='none';
  const box=$('opts');box.innerHTML='';
  opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+'.  '+o.t;b.onclick=()=>answer(i);box.appendChild(b);});
}
async function answer(i){
  if(locked||ended)return;locked=true;
  const {q,opts}=current,ok=opts[i].ok;
  [...$('opts').children].forEach((b,k)=>{b.disabled=true;if(opts[k].ok)b.classList.add('ok');else if(k===i)b.classList.add('bad');else b.classList.add('dim');});
  const e=$('exp');e.innerHTML='<b>'+(ok?'✔ Correct! ':'✘ Not quite. ')+'</b>'+q.e+
    '<small>Source: Microsoft Learn — “'+q.src.mod+'” · <a href="'+q.src.url+'" target="_blank" rel="noopener">learn.microsoft.com</a></small>';
  e.style.display='block';
  beep(ok?660:180,.15,'triangle',.07,ok?200:-60);
  if(ok){correct++;await heroStrike();}else await enemyStrike();
  $('prog').textContent='Question '+(qi+1)+' / '+QUESTIONS_PER_RUN+'  ·  Correct: '+correct;
  if(enemy.hp<=0){ended=true;await enemyExplodes();return finish(true);}
  if(hero.hp<=0){ended=true;await heroFalls();return finish(false);}
  $('next').style.display='inline-block';$('next').focus();
}
function next(){if(locked&&$('next').style.display==='inline-block'){qi++;showQuestion();}}
function finish(win){
  const n=qi+1,pct=Math.round(100*correct/n);
  const o=$('overlay');o.className=win?'win':'lose';o.style.display='flex';
  o.innerHTML=win
   ?`<h1>VICTORY!</h1><p>You are the winner! The Cloud Beast is vanquished and you reached the battle target.</p><p>${correct} correct out of ${n} answered (${pct}%). Battle target: 80% correct (24 of 30).</p>`
   :`<h1>GAME OVER</h1><p>The Cloud Beast has defeated you. Review the explanations and try again!</p><p>${correct} correct out of ${n} answered (${pct}%). Aim for at least 80% correct (24 of 30) to defeat the Cloud Beast.</p>`;
  const b=document.createElement('button');b.className='big';b.textContent='↻ RESTART';b.onclick=startRun;o.appendChild(b);b.focus();
}
$('next').onclick=next;$('mus').onclick=()=>{ac();setMusic(!musicOn);$('mus').blur();};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();if(k==='m'){ac();setMusic(!musicOn);return;}
  const i='abcd'.indexOf(k),j='1234'.indexOf(k);
  if(!locked&&!ended&&(i>-1||j>-1))answer(i>-1?i:j);
  else if((k==='enter'||k===' ')&&$('next').style.display==='inline-block'){e.preventDefault();next();}
});

/* ===================== BOOT ===================== */
(async()=>{
  bgImg=await loadImg(ASSETS.bg);
  for(const k of Object.keys(ASSETS.sprites)){const s=ASSETS.sprites[k];IMG[k]={img:await loadImg(s.src),w:s.w,h:s.h};}
  hero=mkActor('hero','hero',HERO_HOME,HERO_MAX);enemy=mkActor('enemy','enemy',ENEMY_HOME,ENEMY_MAX);
  requestAnimationFrame(frame);
  const o=$('overlay');o.style.display='flex';o.className='';
  o.innerHTML='<h1 style="color:#6ee7d1">AZ-900 BATTLE QUEST</h1><p>Answer Azure Fundamentals questions to fight the Cloud Beast.</p><p>Correct answer: your knight strikes (−'+DMG_ENEMY+' of '+ENEMY_MAX+' HP). Wrong answer: the beast strikes (−'+DMG_HERO+' of '+HERO_MAX+' HP).</p><p>Land at least 80% correct (24 of 30) to win. Keys: A–D or 1–4 to answer, Enter for next.</p>';
  const b=document.createElement('button');b.className='big';b.textContent='▶ START BATTLE';b.onclick=startRun;o.appendChild(b);
  $('q').textContent='Press START to begin.';
})();
</script>
